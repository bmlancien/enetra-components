<!DOCTYPE html>
<html lang="de">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Enetra – Prototype</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="/src/style.css" />
    <script src="https://unpkg.com/lucide@latest/dist/umd/lucide.min.js"></script>
    <script defer src="https://unpkg.com/alpinejs@3.x.x/dist/cdn.min.js"></script>
  </head>
  <body class="bg-slate-50 font-[Inter,sans-serif] text-slate-800 min-h-screen flex flex-col">

    <!-- Header -->
    <header class="bg-white border-b border-slate-200 flex h-14 items-center justify-between px-6 shrink-0">
      <img src="/images/enetra-logo.png" alt="Enetra" class="h-5 w-32 object-contain" />
    </header>

    <!-- Main Content -->
    <main class="px-6 lg:px-12 py-12 flex-1">
      <div class="max-w-[1344px] mx-auto w-full flex flex-col gap-12">

        <!-- Pages -->
        <section class="flex flex-col gap-4">
          <h2 class="text-base font-bold text-slate-800">Pages</h2>
          <ul class="flex flex-col gap-2">
            <li>
              <a href="/projects.html" class="flex items-center gap-2 text-sm text-cyan-700 font-semibold hover:underline">
                <i data-lucide="file" class="w-4 h-4"></i>
                projects.html
              </a>
            </li>
            <li>
              <a href="/project-overview.html" class="flex items-center gap-2 text-sm text-cyan-700 font-semibold hover:underline">
                <i data-lucide="file" class="w-4 h-4"></i>
                project-overview.html
              </a>
            </li>
            <li>
              <a href="/login.html" class="flex items-center gap-2 text-sm text-cyan-700 font-semibold hover:underline">
                <i data-lucide="file" class="w-4 h-4"></i>
                login.html
              </a>
            </li>
            <li>
              <a href="/register.html" class="flex items-center gap-2 text-sm text-cyan-700 font-semibold hover:underline">
                <i data-lucide="file" class="w-4 h-4"></i>
                register.html
              </a>
            </li>
            <li>
              <a href="/forgot-password.html" class="flex items-center gap-2 text-sm text-cyan-700 font-semibold hover:underline">
                <i data-lucide="file" class="w-4 h-4"></i>
                forgot-password.html
              </a>
            </li>
            <li>
              <a href="/reset-password.html" class="flex items-center gap-2 text-sm text-cyan-700 font-semibold hover:underline">
                <i data-lucide="file" class="w-4 h-4"></i>
                reset-password.html
              </a>
            </li>
          </ul>
        </section>

        <!-- Components -->
        <section class="flex flex-col gap-4">
          <h2 class="text-base font-bold text-slate-800">Components</h2>
          <ul class="flex flex-col gap-2">
            <li class="flex flex-col gap-1">
              <span class="flex items-center gap-2 text-sm font-semibold text-slate-800">
                <i data-lucide="component" class="w-4 h-4"></i>
                toolbar
              </span>
              <ul class="flex flex-col gap-1 pl-6">
                <li>
                  <a href="/components/toolbar/toolbar.html" class="flex items-center gap-2 text-sm text-cyan-700 hover:underline">
                    <i data-lucide="file-code" class="w-4 h-4"></i>
                    toolbar.html
                  </a>
                </li>
                <li>
                  <a href="/components/toolbar/README.md" class="flex items-center gap-2 text-sm text-cyan-700 hover:underline">
                    <i data-lucide="file-text" class="w-4 h-4"></i>
                    README.md
                  </a>
                </li>
              </ul>
            </li>
          </ul>
        </section>

      </div>
    </main>

    <!-- Footer -->
    <footer class="bg-white border-t border-slate-200 flex items-center justify-between px-6 h-12">
      <img src="/images/enetra-logo.png" alt="Enetra" class="h-4 object-contain" />
      <nav class="flex gap-6 items-center">
        <a href="#" class="text-sm text-slate-500 hover:text-slate-800">Impressum</a>
        <a href="#" class="text-sm text-slate-500 hover:text-slate-800">Datenschutz</a>
        <a href="#" class="text-sm text-slate-500 hover:text-slate-800">Kontakt</a>
      </nav>
    </footer>

    <script>lucide.createIcons();</script>
  </body>
</html>
