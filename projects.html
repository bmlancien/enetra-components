<!DOCTYPE html>
<html lang="de">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Meine Projekte – Enetra</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="/src/style.css" />
    <script src="https://unpkg.com/lucide@latest/dist/umd/lucide.min.js"></script>
  </head>
  <body class="bg-slate-50 font-[Inter,sans-serif] text-slate-800 min-h-screen flex flex-col">

    <!-- Header -->
    <header class="bg-white border-b border-slate-200 flex h-14 items-center justify-between px-6 shrink-0">
      <img src="/images/enetra-logo.png" alt="Enetra" class="h-5 w-32 object-contain" />
      <nav class="flex gap-6 items-center">
        <span class="text-sm font-semibold text-slate-800">Projekte</span>
        <div class="flex gap-2 items-center">
          <i data-lucide="user-circle" class="w-4 h-4 text-slate-800"></i>
          <span class="text-sm text-slate-800">Mein Konto</span>
        </div>
      </nav>
    </header>

    <!-- Main Content -->
    <main class="px-6 lg:px-12 py-12 flex-1">
      <div class="max-w-[1344px] mx-auto w-full flex flex-col gap-8">

        <!-- Page Header -->
        <div class="flex items-end justify-between gap-4">
          <div class="flex flex-col gap-2">
            <h1 class="text-[40px] font-bold leading-normal text-slate-800">Meine Projekte</h1>
            <p class="text-base text-slate-500">Verwalten Sie Ihre Binnenhafenenergie-Forschungsprojekte und Szenarien</p>
          </div>
          <button class="px-6 py-2 bg-cyan-700 rounded-full flex items-center gap-2 shrink-0 cursor-pointer">
            <i data-lucide="plus-circle" class="w-4 h-4 text-white"></i>
            <span class="text-sm font-semibold text-white tracking-tight">Projekt erstellen</span>
          </button>
        </div>

        <!-- Search and Sort -->
        <div class="flex flex-col gap-6">
          <div class="flex gap-4 items-center">
            <div class="w-80 h-10 bg-white px-4 py-3 rounded-[3px] outline outline-1 outline-offset-[-1px] outline-slate-400 flex items-center gap-4">
              <i data-lucide="search" class="w-4 h-4 text-slate-500 shrink-0"></i>
              <span class="text-sm text-slate-500">Projekte durchsuchen...</span>
            </div>
            <div class="h-10 bg-white px-4 py-3 rounded-[3px] outline outline-1 outline-offset-[-1px] outline-slate-400 flex items-center gap-4 cursor-pointer">
              <span class="text-sm font-semibold text-slate-800">Sortieren</span>
              <i data-lucide="chevron-down" class="w-4 h-4 text-slate-800"></i>
            </div>
          </div>

          <!-- Project Cards -->
          <div class="flex flex-wrap gap-5">

            <!-- Westhafen -->
            <div class="w-96 p-6 bg-white rounded-lg shadow-[0px_1px_4px_0px_rgba(0,0,0,0.10)] outline outline-1 outline-offset-[-1px] outline-slate-200 flex flex-col gap-6">
              <div class="pb-4 border-b border-slate-200 flex flex-col gap-2">
                <div class="flex items-center justify-between">
                  <span class="text-xl font-bold text-cyan-700 leading-normal">Westhafen</span>
                  <i data-lucide="ellipsis" class="w-4 h-4 text-slate-800"></i>
                </div>
                <div class="flex items-center gap-2">
                  <i data-lucide="map-pin" class="w-[19px] h-[19px] text-slate-500"></i>
                  <span class="text-sm text-slate-500">Berlin</span>
                </div>
              </div>
              <div class="flex items-center justify-between">
                <div class="flex items-center gap-6">
                  <span class="text-sm text-slate-800">3 Szenarien</span>
                  <div class="flex items-center gap-2">
                    <i data-lucide="users" class="w-4 h-4 text-slate-800"></i>
                    <span class="text-sm text-slate-800">5</span>
                  </div>
                </div>
                <div class="flex items-center gap-2">
                  <i data-lucide="calendar" class="w-4 h-4 text-slate-500"></i>
                  <span class="text-sm text-slate-500">27.06.2026</span>
                </div>
              </div>
              <button class="flex-1 px-6 py-2 rounded-full outline outline-1 outline-offset-[-1px] outline-cyan-700 flex justify-center items-center gap-3 cursor-pointer">
                <i data-lucide="arrow-left-right" class="w-4 h-4 text-cyan-700"></i>
                <span class="text-sm font-semibold text-cyan-700 tracking-tight">Szenarienvergleich</span>
              </button>
            </div>

            <!-- Westhafen Test -->
            <div class="w-96 p-6 bg-white rounded-lg shadow-[0px_1px_4px_0px_rgba(0,0,0,0.10)] outline outline-1 outline-offset-[-1px] outline-slate-200 flex flex-col gap-6">
              <div class="pb-4 border-b border-slate-200 flex flex-col gap-2">
                <div class="flex items-center justify-between">
                  <span class="text-xl font-bold text-cyan-700 leading-normal">Westhafen Test</span>
                  <i data-lucide="ellipsis" class="w-4 h-4 text-slate-800"></i>
                </div>
                <div class="flex items-center gap-2">
                  <i data-lucide="map-pin" class="w-[19px] h-[19px] text-slate-500"></i>
                  <span class="text-sm text-slate-500">Berlin</span>
                </div>
              </div>
              <p class="text-sm text-slate-500">Noch kein Szenario erstellt</p>
            </div>

          </div>
        </div>

      </div>
    </main>

    <!-- Footer -->
    <footer class="bg-white border-t border-slate-200 flex items-center justify-between px-6 h-12">
      <img src="/images/enetra-logo.png" alt="Enetra" class="h-4 object-contain" />
      <nav class="flex gap-6 items-center">
        <a href="#" class="text-sm text-slate-500 hover:text-slate-800">Impressum</a>
        <a href="#" class="text-sm text-slate-500 hover:text-slate-800">Datenschutz</a>
        <a href="#" class="text-sm text-slate-500 hover:text-slate-800">Kontakt</a>
      </nav>
    </footer>

    <script>lucide.createIcons();</script>
  </body>
</html>
